name: townhawll-local

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-townhawll}
      POSTGRES_USER: ${POSTGRES_USER:-townhawll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-townhawll_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - townhawll_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-townhawll} -d
          ${POSTGRES_DB:-townhawll}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  townhawll_postgres_data:
